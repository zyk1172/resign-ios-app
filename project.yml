name: Resign
options:
  bundleIdPrefix: com.resign
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  # Shared core + scheduled worker entry. Compiled into its own executable so
  # the LaunchAgent can run build/install logic in Swift instead of a
  # duplicated bash engine. Embeds into Resign.app/Contents/MacOS/.
  ResignWorker:
    type: tool
    platform: macOS
    sources:
      - path: Resign/Core
      - path: Resign/Worker
    settings:
      base:
        PRODUCT_NAME: ResignWorker
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES

  Resign:
    type: application
    platform: macOS
    sources:
      - path: Resign
        excludes:
          - "**/.DS_Store"
          - "Worker/**"
    dependencies:
      - target: ResignWorker
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resign.app
        PRODUCT_NAME: Resign
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Resign contributors"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ResignTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ResignTests
    dependencies:
      - target: Resign
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.resign.app.tests

# Shared scheme: 让 Codex / CI 无需打开 Xcode 即可 build/test/archive
schemes:
  Resign:
    build:
      targets:
        Resign: all
        ResignWorker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ResignTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
